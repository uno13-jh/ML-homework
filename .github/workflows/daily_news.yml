name: Daily Finance & Tech Digest

on:
  schedule:
    # Run every day at 08:00 UTC+8 (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:  # allow manual triggering

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: daily_news/requirements.txt

      - name: Install dependencies
        run: pip install -r daily_news/requirements.txt

      - name: Generate today's digest
        run: python daily_news/main.py

      - name: Commit and push digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_news/output/
          if git diff --cached --quiet; then
            echo "No new content to commit."
          else
            git commit -m "chore: daily finance & tech digest $(date -u +'%Y-%m-%d')"
            git push
          fi
